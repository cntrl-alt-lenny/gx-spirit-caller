name: Compile changed C

# This is deliberately a compile-only gate. It proves that changed game C
# reaches a valid ARM relocatable; byte identity still belongs to the local
# baserom-backed gates and is never attempted here.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/configure.py'
      - 'tools/transform_dep.py'
      - '.github/workflows/compile-check.yml'

permissions:
  contents: read

jobs:
  compile:
    name: Compile changed C (${{ matrix.region }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        region: [eur, usa, jpn]

    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache mwccarm toolchain
        id: mwccarm-cache
        uses: actions/cache@v4
        with:
          path: tools/mwccarm
          # download_tool.py contains the tool tag and URL builders; changing
          # either invalidates this cache automatically.
          key: ${{ runner.os }}-mwccarm-${{ hashFiles('tools/download_tool.py') }}

      - name: Report mwccarm cache status
        shell: pwsh
        run: |
          if ('${{ steps.mwccarm-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host 'mwccarm cache hit'
          } else {
            Write-Host 'mwccarm cache miss; configure will populate it'
          }

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Generate baserom-free build graph
        shell: pwsh
        env:
          REGION: ${{ matrix.region }}
        run: python tools/configure.py $env:REGION --skip-sha1

      - name: Find changed C targets
        id: targets
        shell: pwsh
        env:
          REGION: ${{ matrix.region }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $files = @(git diff --name-only --diff-filter=ACMR $env:BASE_SHA $env:HEAD_SHA -- 'src/**/*.c')
          $files = @($files | ForEach-Object { $_ -replace '\\', '/' } | Where-Object {
            # Region-EXCLUSIVE, not region-inclusive: src/main/ and src/overlayNNN/
            # (no region prefix) are the EUR baseline ONLY -- config/usa/arm9/delinks.txt
            # has 1057 src/usa/ entries and ZERO src/main/ entries, so an unprefixed path
            # is not a valid usa/jpn build target. eur = unprefixed (NOT under src/usa/ or
            # src/jpn/); usa/jpn = only their own prefixed subtree.
            $_ -match '^src/.*\.c$' -and (
              ($env:REGION -eq 'eur' -and $_ -notmatch '^src/(usa|jpn)/') -or
              ($env:REGION -ne 'eur' -and $_ -match "^src/$env:REGION/")
            )
          })

          # A workflow-only PR has no changed C file. Compile one stable
          # sentinel so a newly added workflow exercises its own toolchain
          # path; normal source PRs remain strictly diff-scoped.
          if ($files.Count -eq 0) {
            $sentinel = @{
              eur = 'src/main/Copy32.c'
              usa = 'src/usa/main/AutoloadCallback.c'
              jpn = 'src/jpn/main/AutoloadCallback.c'
            }[$env:REGION]
            $files = @($sentinel)
            Write-Host "No changed C files for $env:REGION; using compile sentinel $($files[0])."
          }

          $targets = @($files | ForEach-Object {
            $object = [IO.Path]::ChangeExtension($_, '.o')
            "build/$env:REGION/$object"
          })
          $joined = $targets -join ' '
          "targets=$joined" >> $env:GITHUB_OUTPUT
          Write-Host "Compile targets ($env:REGION): $joined"

      - name: Compile changed C targets
        shell: pwsh
        run: ninja ${{ steps.targets.outputs.targets }}
