name: Generated files drift

# Gates auto-generated docs against drift. Each generator exposes a
# `--check` mode that exits non-zero if the committed output differs
# from a fresh regeneration. Catches PRs that add a new tool or brief
# without re-running the regenerator.
#
# Currently gates:
#   docs/tools-index.md     ← tools/generate_tool_index.py
#   docs/briefs/README.md   ← tools/generate_briefs_index.py
#   docs/research/README.md ← tools/generate_research_index.py
#
# Does NOT gate assets/progress-heatmap.svg — its committed form is
# generated from `report.json` (post-`ninja report`, requires baserom),
# while CI falls back to `delinks.txt` synthesis which produces a
# structurally-different SVG. A CI gate would always false-fail.

# DELIBERATELY UNFILTERED. `drift-check` is a REQUIRED status check in the
# `main-protection` ruleset. GitHub blocks a PR until every required check
# reports, and a workflow skipped by a `paths:` filter never reports at all
# — it does not resolve as "passed", it stays pending forever. So a required
# check must run on EVERY pull request or it is a merge deadlock, not a gate.
#
# This bit for real: PR #1360 (the pytest-CI fix) touched only
# `docs/queue/*.md` + `tests/*.py`, matched none of the old paths below, and
# sat BLOCKED with all five of its actual checks green. The campaign had not
# hit it earlier only because every worker PR happens to write a
# `docs/research/**.md` writeup, which the old filter matched by luck.
#
# The old filter listed: tools/**.py, docs/tools-index.md, docs/briefs/**.md,
# docs/research/**.md, and this workflow file. The job is checkout + Python +
# three `--check` invocations, so running it unconditionally is cheap.
#
# If this is ever re-filtered, drop it from the required-check list in the
# same change — the two settings are only safe together.
on:
  pull_request:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Ship-coverage validation derives round flips from round-labelled
          # commits, so the drift job must have the history it validates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python deps
        run: pip install -r tools/requirements.txt

      - name: Check tools-index drift
        run: python tools/generate_tool_index.py --check

      - name: Check briefs-index drift
        run: python tools/generate_briefs_index.py --check

      - name: Check research-index drift
        run: python tools/generate_research_index.py --check

      - name: Validate attempts ledger
        run: python tools/validate_attempts.py

      - name: Check queue/state drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/queue_state_drift.py --ref HEAD

      - name: Check dispatch-log handoff
        run: >-
          python tools/check_dispatch_log.py
          --base ${{ github.event.pull_request.base.sha }}
          --head HEAD
