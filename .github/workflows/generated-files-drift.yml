name: Generated files drift

# Checks the project's recorded state on every pull request:
#   docs/ledger/attempts.tsv  <- tools/validate_attempts.py
#   the framework's own checks  <- tools/fw.py check (links, the state budget,
#                                  personal paths, report shape)

# DELIBERATELY UNFILTERED. `drift-check` is a REQUIRED status check in the
# `main-protection` ruleset. GitHub blocks a PR until every required check
# reports, and a workflow skipped by a `paths:` filter never reports at all
# — it does not resolve as "passed", it stays pending forever. So a required
# check must run on EVERY pull request or it is a merge deadlock, not a gate.
#
# This bit for real: PR #1360 (the pytest-CI fix) touched only a queue
# document and `tests/*.py`, matched none of the old path filter, and sat
# BLOCKED with all five of its actual checks green.
#
# The job is checkout + Python + two checks, so running it unconditionally is
# cheap.
#
# If this is ever re-filtered, drop it from the required-check list in the
# same change — the two settings are only safe together.
on:
  pull_request:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Ship-coverage validation derives round flips from round-labelled
          # commits, so the drift job must have the history it validates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python deps
        run: pip install -r tools/requirements.txt

      - name: Validate attempts ledger
        run: python tools/validate_attempts.py

      - name: Framework check
        run: python tools/fw.py check
